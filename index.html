<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pixel Jukebox</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Pixel Jukebox</h1>

        <div id="chest" class="chest" title="click to open the chest"></div>

        <div id="inventory" class="panel hidden"></div>

        <div id="slots" class="panel"></div>

        <div id="jukeboxWrap" class="jukebox-wrap">
            <div id="note" class="note"></div>
            <div id="jukebox" class="jukebox" title="Click: play/pause | Right-click: skip"></div>
        </div>
        
        <div class="controls">
            <button id="playBtn">Play / Pause</button>
            <button id="skipBtn">Skip &gt;&gt;</button>
        </div>

        <p id="status">Open the chest and pick up some discs!</p>
        <p class="credit">All music is original and synthesized in code. No copyright.</p>

        <script src="script.js"></script>
    </body>
</html>
