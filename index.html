<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="saloon-container">
      <header>
        <h1>Dust & Brass Jukebox </h1>
      </header>

      <!-- Main Player Display-->
       <div class="player-card">
       <div class="now-playing">
        <h2>Now Playing</h2>
        <p id="current-title">No song selected</p>
        <p id="current-artist">Pick a song from the library</p>
       </div>

<!-- Controls -->
<div class="controls">
    <button id="prev-btn">Prev</button>
    <button id="play-btn">Play</button>
    <button id="next-btn">Skip</button>
</div>

<div class="volume-box">
    <label for="volume-slider">Volume</label>
    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<!-- Music Library & Queue -->
 <div class="music-section">
    <div class="library">
        <h3>Song Library</h3>
        <input type="text" id="search-bar" placeholder="Search songs...">
            <ul id="song-list">
                <!-- Songs will be added here using JavaScript -->
            </ul>
    </div>
    <div class="queue">
        <h3>Up next</h3>
        <ol id="queue-list">
            <!-- Queue items go here -->
        </ol>
    </div>
  </div>
</div>

<!-- Audio Element -->
<audio id="audio-player"></audio>

<!-- Connect JavaScript -->
<script src="script.js"></script>
</body>
</html>
